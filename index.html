<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice — скачать</title>
<style>
  :root {
    --bg: #08080A; --surface: #111113; --line: #27272B;
    --text: #ECECEE; --muted: #8B8B92;
    --accent: #F5A524; --accent-hover: #FFB53F; --on-accent: #0A0A0B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  main { width: min(440px, 100% - 32px); text-align: center; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 40px 32px;
  }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { margin: 20px 0 4px; font-size: 24px; font-weight: 600; }
  p { margin: 0; color: var(--muted); }
  .btn {
    display: inline-block; margin-top: 28px; padding: 12px 28px;
    background: var(--accent); color: var(--on-accent);
    border-radius: 10px; font-weight: 600; text-decoration: none;
    transition: background .15s ease, transform .15s ease;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(.98); }
  .btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }
  .meta { margin-top: 14px; font: 13px "Cascadia Mono", Consolas, monospace; }
  ul { margin: 24px 0 0; padding: 0; list-style: none; text-align: left; color: var(--muted); font-size: 14px; }
  li { padding: 6px 0; border-top: 1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <img src="logo.png" alt="">
    <h1>Voice</h1>
    <p>Голос и демка напрямую, без лишнего.</p>
    <a id="dl" class="btn" aria-disabled="true" href="#">Скачать для Windows</a>
    <p id="meta" class="meta">Загружаем версию…</p>
    <ul id="notes" hidden></ul>
  </div>
</main>
<script>
  fetch("version.json", { cache: "no-store" })
    .then(r => r.json())
    .then(v => {
      const dl = document.getElementById("dl");
      dl.href = v.url; dl.removeAttribute("aria-disabled");
      document.getElementById("meta").textContent =
        "v" + v.version + " · " + v.published.slice(0, 10);
      const ul = document.getElementById("notes");
      (v.notes || []).slice(0, 8).forEach(n => {
        const li = document.createElement("li"); li.textContent = n; ul.append(li);
      });
      ul.hidden = !ul.children.length;
    })
    .catch(() => { document.getElementById("meta").textContent = "Версия пока не опубликована"; });
</script>
</body>
</html>
